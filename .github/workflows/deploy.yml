name: FINQ Production Deployment Matrix

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend to Railway/Render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Determine Render CLI/Deploy Action
        uses: johnbeynon/render-deploy-action@v0.0.8
        # Ensure RENDER_SERVICE_ID and RENDER_API_KEY are configured in GitHub Settings -> Secrets
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          # The deployment strategy uses Vercel for Web + Render for API architecture defined in the READMEs.

  deploy-flutter-web-vercel:
    name: Build & Deploy Flutter Web to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"

      - name: Build Web Bundle
        working-directory: finq-flutter
        run: |
          flutter pub get
          # The custom production endpoint must be injected via Vercel GUI environment variables, 
          # otherwise it defaults to local.
          flutter build web --release

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: finq-flutter/build/web
          vercel-args: "--prod"
