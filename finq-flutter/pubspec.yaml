name: finq_flutter
description: Flutter client for FinQ.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  csv: ^6.0.0
  dio: ^5.7.0
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^3.2.2
  firebase_auth: ^5.3.0
  firebase_core: ^3.6.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.3.0
  google_sign_in: ^6.2.1
  intl: ^0.19.0
  path_provider: ^2.1.1
  web_socket_channel: ^3.0.1
  fl_chart: ^1.1.1
  shared_preferences: ^2.2.2
  universal_html: ^2.2.4
  flutter_svg: ^2.2.3
  flutter_markdown: ^0.7.2
  flex_color_scheme: ^8.4.0
  firebase_storage: ^12.4.10
  image_picker: ^1.0.7
  printing: ^5.14.2
  pdf: ^3.11.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo.svg
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
