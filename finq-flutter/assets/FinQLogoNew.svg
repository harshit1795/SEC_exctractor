<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350">
  <defs>
    <linearGradient id="light-grad-main" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#005c97;stop-opacity:1" /> <stop offset="100%" style="stop-color:#363795;stop-opacity:1" /> </linearGradient>
    <linearGradient id="light-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" /> <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" /> </linearGradient>
    
    <linearGradient id="dark-grad-main" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" /> <stop offset="100%" style="stop-color:#00FFFF;stop-opacity:1" /> </linearGradient>
    <linearGradient id="dark-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:1" /> <stop offset="100%" style="stop-color:#64FFDA;stop-opacity:1" /> </linearGradient>

    <filter id="neon-glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur5" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur10" />
      <feMerge>
        <feMergeNode in="blur10" opacity="0.7"/>
        <feMergeNode in="blur5"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="intuitive-q-symbol">
       <g class="nexus-ring" fill="none" stroke-width="3" opacity="0.7">
         <circle cx="60" cy="60" r="45" stroke-dasharray="5,5" />
         <circle cx="60" cy="15" r="5" fill="currentColor" stroke="none"/>
         <circle cx="105" cy="60" r="5" fill="currentColor" stroke="none"/>
         <circle cx="60" cy="105" r="5" fill="currentColor" stroke="none"/>
         <circle cx="15" cy="60" r="5" fill="currentColor" stroke="none"/>
         <path d="M60,15 L105,60 M105,60 L60,105 M60,105 L15,60 M15,60 L60,15" opacity="0.4"/>
       </g>
       
       <g class="finance-arrow" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
         <path d="M40,80 C50,80 60,75 70,60 L110,20" /> <path d="M110,20 L85,25 M110,20 L105,45" /> </g>
    </g>
  </defs>

  <g transform="translate(30, 60)">
    <g transform="translate(0, 20)">
        <g stroke="url(#light-grad-main)" fill="url(#light-grad-main)">
           <use href="#intuitive-q-symbol" class="nexus-ring"/>
        </g>
        <g stroke="url(#light-grad-accent)">
           <use href="#intuitive-q-symbol" class="finance-arrow"/>
        </g>
    </g>

    <g transform="translate(140, 100)">
      <text font-family="'Montserrat', sans-serif" font-size="70" font-weight="900" fill="#1a237e">
        Fin<tspan fill="url(#light-grad-accent)">Q</tspan>
      </text>
      <text x="5" y="40" font-family="'Montserrat', sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#5c6bc0">
        NEXUS AI
      </text>
    </g>
     <text x="160" y="-30" font-family="sans-serif" font-size="18" fill="#999" font-weight="bold">LIGHT MODE</text>
  </g>


  <rect x="425" y="0" width="425" height="350" fill="#0a0e17"/>

  <g transform="translate(460, 60)">
    <g transform="translate(0, 20)" filter="url(#neon-glow-intense)">
       <g stroke="url(#dark-grad-main)" fill="url(#dark-grad-main)">
           <use href="#intuitive-q-symbol" class="nexus-ring"/>
        </g>
        <g stroke="url(#dark-grad-accent)">
           <use href="#intuitive-q-symbol" class="finance-arrow"/>
        </g>
    </g>

    <g transform="translate(140, 100)">
      <text font-family="'Montserrat', sans-serif" font-size="70" font-weight="900" fill="#ffffff">
        Fin<tspan fill="url(#dark-grad-accent)" filter="url(#neon-glow-intense)">Q</tspan>
      </text>
      <text x="5" y="40" font-family="'Montserrat', sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#80d8ff">
        NEXUS AI
      </text>
    </g>
    <text x="160" y="-30" font-family="sans-serif" font-size="18" fill="#555" font-weight="bold">DARK MODE</text>
  </g>

  <line x1="425" y1="30" x2="425" y2="320" stroke="#37474f" stroke-width="2" stroke-dasharray="5,5"/>

</svg>