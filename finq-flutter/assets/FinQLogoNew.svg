<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="light-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2342;stop-opacity:1" /> <stop offset="100%" style="stop-color:#007EA7;stop-opacity:1" /> </linearGradient>
    <linearGradient id="light-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#007EA7;stop-opacity:1" /> <stop offset="100%" style="stop-color:#00A8E8;stop-opacity:1" /> </linearGradient>

    <linearGradient id="dark-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004e92;stop-opacity:1" /> <stop offset="100%" style="stop-color:#00c6ff;stop-opacity:1" /> </linearGradient>
    <linearGradient id="dark-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:1" /> <stop offset="100%" style="stop-color:#E0FFFF;stop-opacity:1" /> </linearGradient>

    <filter id="tech-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur5" />
      <feMerge>
        <feMergeNode in="blur5" opacity="0.6"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="finq-emblem">
      <circle cx="60" cy="60" r="50" fill="none" stroke="currentColor" stroke-width="6" />
      
      <g class="accent-fill" fill="currentColor" stroke="none">
          <circle cx="60" cy="60" r="7" />
          <circle cx="35" cy="45" r="3.5" opacity="0.8"/>
          <circle cx="85" cy="45" r="3.5" opacity="0.8"/>
          <circle cx="40" cy="85" r="3.5" opacity="0.8"/>
          <circle cx="80" cy="80" r="3.5" opacity="0.8"/>
          <circle cx="60" cy="25" r="3.5" opacity="0.8"/>
          <path d="M60,60 L35,45 M60,60 L85,45 M60,60 L40,85 M60,60 L80,80 M60,60 L60,25" stroke="currentColor" stroke-width="2" opacity="0.4" />
      </g>

      <g class="accent-stroke" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
         <path d="M75,95 C85,95 100,80 115,40" /> <path d="M115,40 L95,42 M115,40 L112,60" /> </g>
    </g>
  </defs>

  <g transform="translate(40, 70)">
    <g transform="translate(0, 10)">
        <g color="url(#light-grad-primary)">
           <use href="#finq-emblem" />
        </g>
        <g color="url(#light-grad-accent)">
           <use href="#finq-emblem" style="fill:none; stroke:none;"><svg class="accent-fill" fill="url(#light-grad-accent)"/>
             <svg class="accent-stroke" stroke="url(#light-grad-accent)"/>
           </use>
        </g>
    </g>

    <g transform="translate(150, 80)">
      <text font-size="80" font-weight="800" fill="#0A2342" letter-spacing="-1">
        Fin<tspan fill="url(#light-grad-accent)">Q</tspan>
      </text>
      <text x="5" y="45" font-size="18" font-weight="500" fill="#007EA7" letter-spacing="0.5">
        EMPOWERING SMARTER INVESTMENT DECISIONS
      </text>
    </g>
     <text x="180" y="-30" font-size="16" fill="#99abbb" font-weight="700" letter-spacing="1">PROFESSIONAL LIGHT</text>
  </g>


  <rect x="450" y="0" width="450" height="350" fill="#050A14"/>

  <g transform="translate(490, 70)">
    <g transform="translate(0, 10)" filter="url(#tech-glow)">
         <g color="url(#dark-grad-primary)">
           <use href="#finq-emblem" />
        </g>
        <g color="url(#dark-grad-accent)">
           <use href="#finq-emblem" style="fill:none; stroke:none;">
             <svg class="accent-fill" fill="url(#dark-grad-accent)"/>
             <svg class="accent-stroke" stroke="url(#dark-grad-accent)"/>
           </use>
        </g>
    </g>

    <g transform="translate(150, 80)">
      <text font-size="80" font-weight="800" fill="#ffffff" letter-spacing="-1">
        Fin<tspan fill="url(#dark-grad-accent)" filter="url(#tech-glow)">Q</tspan>
      </text>
      <text x="5" y="45" font-size="18" font-weight="500" fill="#7FDAF4" letter-spacing="0.5" opacity="0.9">
        EMPOWERING SMARTER INVESTMENT DECISIONS
      </text>
    </g>
    <text x="180" y="-30" font-size="16" fill="#50657e" font-weight="700" letter-spacing="1">FUTURE DARK</text>
  </g>

  <line x1="450" y1="40" x2="450" y2="310" stroke="#2c3e50" stroke-width="1" stroke-dasharray="4,6" opacity="0.5"/>

</svg>