<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F1F5"/>
      <stop offset="100%" stop-color="#CFDBE6"/>
    </linearGradient>

    <radialGradient id="goldSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFECB3" stop-opacity="1"/>
      <stop offset="50%" stop-color="#DAA520" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8B6508" stop-opacity="1"/>
    </radialGradient>
    
    <radialGradient id="goldHighlight" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004D40"/>
      <stop offset="50%" stop-color="#00BFA5"/>
      <stop offset="100%" stop-color="#1DE9B6"/>
    </linearGradient>


  </defs>

  <rect x="50" y="50" width="700" height="700" rx="60" fill="url(#cardBg)" stroke="#FFFFFF" stroke-width="2"/>

  <g transform="translate(400, 360)"> <g opacity="0.9">
      <path d="M -160 0 A 160 160 0 0 1 160 0" fill="none" stroke="#006064" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
      <path d="M -150 40 A 160 160 0 0 0 100 130" fill="none" stroke="#004D40" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
      
      <circle cx="-120" cy="-40" r="50" fill="#26A69A" opacity="0.3"/>
      <circle cx="120" cy="50" r="60" fill="#26A69A" opacity="0.2"/>
      <circle cx="0" cy="-140" r="40" fill="#26A69A" opacity="0.2"/>
    </g>

    <g stroke="#00838F" stroke-width="2">
      <line x1="80" y1="-80" x2="140" y2="-120" /> <circle cx="140" cy="-120" r="4" fill="#00BCD4" stroke="none"/>
      <line x1="60" y1="-90" x2="90" y2="-150" /> <circle cx="90" cy="-150" r="4" fill="#00BCD4" stroke="none"/>
      <line x1="-100" y1="0" x2="-180" y2="-20" /> <circle cx="-180" cy="-20" r="4" fill="#00BCD4" stroke="none"/>
      <line x1="-90" y1="50" x2="-150" y2="80" /> <circle cx="-150" cy="80" r="4" fill="#00BCD4" stroke="none"/>
      <line x1="0" y1="110" x2="0" y2="170" /> <circle cx="0" cy="170" r="4" fill="#00BCD4" stroke="none"/>
      <line x1="50" y1="100" x2="80" y2="160" /> <circle cx="80" cy="160" r="4" fill="#00BCD4" stroke="none"/>
    </g>

    <g>
      <circle cx="0" cy="0" r="115" fill="url(#goldSphere)" />
      
      <g fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.4">
        <ellipse cx="0" cy="0" rx="115" ry="40" transform="rotate(20)"/>
        <ellipse cx="0" cy="0" rx="115" ry="80" transform="rotate(20)"/>
        <ellipse cx="0" cy="0" rx="50" ry="115" transform="rotate(-10)"/>
        <ellipse cx="0" cy="0" rx="90" ry="115" transform="rotate(-10)"/>
        <circle cx="0" cy="0" r="115" stroke-width="1"/>
      </g>
      
      <circle cx="0" cy="0" r="113" fill="url(#goldHighlight)"/>
    </g>

    <g transform="translate(30, 10)">
      <circle cx="0" cy="0" r="45" fill="none" stroke="#F0E68C" stroke-width="8" opacity="0.9"/>
      <circle cx="0" cy="0" r="45" fill="#FFFFFF" fill-opacity="0.1"/> <path d="M 35 35 L 60 60" stroke="#DAA520" stroke-width="10" stroke-linecap="round"/>
    </g>

    <path d="M -160 30 
             Q -120 140, 0 100 
             Q 80 80, 160 -120" 
          fill="none" stroke="url(#arrowGrad)" stroke-width="18" stroke-linecap="round"/>
    
    <path d="M 160 -120 L 130 -110 L 175 -150 L 170 -100 Z" fill="#1DE9B6"/>

  </g> <g text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="400" y="630" font-weight="800" font-size="90" fill="#00334E">FinQ</text>
    
    <text x="400" y="675" font-weight="400" font-size="28" fill="#546E7A" letter-spacing="1">AI &amp; Financial Nexus</text>
  </g>

  <path d="M 750 750 Q 760 740 770 750 Q 760 760 750 750" fill="#FFFFFF" opacity="0.8"/>

</svg>