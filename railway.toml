# Railway configuration file
# This file tells Railway how to build and deploy your application
# Place this file in your repository ROOT (not in finq-backend/)

[build]
# Root directory for the build (relative to repo root)
root = "finq-backend"
# Watch paths for triggering redeployments (optional - monitors changes)
watchPatterns = ["finq-backend/**"]
# Ensure we use the correct requirements.txt
buildCommand = "pip install -r requirements.txt"

[deploy]
# Start command for the application
startCommand = "/app/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"

